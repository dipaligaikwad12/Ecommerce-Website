
<!DOCTYPE html>
<html>
<head>
    <title>My Shopping Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Shopping Website</h1>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart</a>
    </div>

    <h2>Welcome to My Website</h2>
    <p>Buy your favourite products here!</p>

    <h2 id="products">Our Products</h2>

    <div class="products">

        <div class="product">
            <img src="images/headphone.jpg" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹500</p>
            <button onclick="addToCart('Headphones', 500)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="images/watch.jpg" alt="Watch">
            <h3>Watch</h3>
            <p>Price: ₹800</p>
            <button onclick="addToCart('Watch', 800)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="images/bag.jpg" alt="Bag">
            <h3>Bag</h3>
            <p>Price: ₹600</p>
            <button onclick="addToCart('Bag', 600)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="images/shoes.jpg" alt="Shoes">
            <h3>Shoes</h3>
            <p>Price: ₹1200</p>
            <button onclick="addToCart('Shoes', 1200)">
                Add to Cart
            </button>
        </div>

    </div>

    <h2 id="cart">My Cart</h2>

    <ul id="cartItems"></ul>

    <h3>Total: ₹<span id="total">0</span></h3>

    <button onclick="clearCart()">Clear Cart</button>

    <footer>
        <p>© 2026 My Shopping Website</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
